[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "raid-ops"
version = "0.1.0"
description = "Raid optimization and automation engine"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]